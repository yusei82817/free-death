<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アカウントを作成 | FREE DEATH</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="email-check.css"><link rel="stylesheet" href="account-flow.css">
