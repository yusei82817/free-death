<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ご注文内容の確認 | FREE DEATH</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="checkout-demo.css">  <link rel="stylesheet" href="fullscreen-flow.css">
</head><body class="checkout-demo-page">
<header class="checkout-top"><a href="index.html" class="checkout-brand">FREE DEATH</a><strong>お客様情報を保護しています</strong><span>🛒 カート</span></header>
<main class="checkout-layout"><div class="checkout-left">
<section class="checkout-panel"><h2>お届け先住所または受取場所を追加する</h2><p>商品のお届け先を選択してください。</p><button class="yellow-button" id="addAddress">新しいお届け先住所を追加する</button><button class="plain-button">その他のお届け先住所</button><div class="address-summary" id="addressSummary">お届け先：未設定</div></section>
<section class="checkout-panel"><h2>お支払い方法</h2><p>お支払い方法を選択してください。</p><span>お支払い方法：未選択</span></section>
<section class="checkout-panel"><h2>商品と配送情報を確認</h2><p>ご注文商品</p><div class="checkout-product"><div class="checkout-product-image"><img src="assets/products/photography-book.jpg" alt="1st キズナアイの写真集"></div><div><strong>1st キズナアイの写真集</strong><p>販売元：FREE DEATH</p><b>￥700</b></div></div></section></div>
<aside class="checkout-side"><button class="yellow-button" id="placeOrder">この内容で注文を確定する</button><p>注文内容：</p><p>商品小計： ￥700</p><p>配送料・手数料： ￥0</p><hr><strong>ご請求額： ￥700</strong><p class="checkout-muted">これは映像撮影用のローカルデモです。注文・決済・配送は行われません。</p></aside></main>
<div class="address-overlay" id="addressModal"><section class="address-modal"><button class="modal-close" id="closeModal">×</button><h2>新しいお届け先住所を入力</h2><label>国/地域<select><option>Japan</option></select></label><label>氏名（フルネーム）<input id="addrName" placeholder="氏名"></label><label>電話番号<input placeholder="例：090-0000-0000"></label><label>郵便番号<input placeholder="例：000-0000"></label><label>都道府県<select><option>都道府県を選択</option><option>東京都</option><option>大阪府</option><option>京都府</option><option>神奈川県</option></select></label><label>市区町村<input placeholder="市区町村"></label><label>番地・建物名<input placeholder="番地・建物名"></label><button class="yellow-button" id="saveAddress">この住所を使用</button></section></div>
<script>const modal=document.getElementById('addressModal');document.getElementById('addAddress').onclick=()=>modal.classList.add('show');document.getElementById('closeModal').onclick=()=>modal.classList.remove('show');document.getElementById('saveAddress').onclick=()=>{const n=document.getElementById('addrName').value.trim();document.getElementById('addressSummary').textContent='お届け先：'+(n||'入力済み');modal.classList.remove('show')};document.getElementById('placeOrder').onclick=()=>alert('デモ画面のため、注文・決済は実行されません。');</script>  <script src="fullscreen-flow.js"></script>
</body></html>
