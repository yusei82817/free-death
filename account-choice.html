<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>アカウントの確認 | FREE DEATH</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="email-check.css">
  <link rel="stylesheet" href="account-choice.css">
</head>
<body class="email-check-page">
  <main class="signin-main">
    <a class="signin-logo" href="store.html" aria-label="FREE DEATH"><span>FREE DEATH</span></a>
    <section class="signin-card account-choice-card">
      <h1>FREE DEATHを初めてご利用のようです</h1>
      <div class="account-email"><span id="accountEmail"></span><a href="email-check.html">変更</a></div>
      <p class="account-message">Eメールアドレスを使ってアカウントを作成しましょう</p>
      <button class="account-create-button" id="createAccount">アカウントの作成に進む</button>
      <div class="signin-divider account-divider"></div>
      <strong class="existing-title">すでにFREE DEATHをご利用ですか？</strong>
      <a class="existing-link" href="email-check.html">別のEメールアドレスまたは携帯電話でサインインする</a>
    </section>
  </main>
  <footer class="signin-footer">
    <div><a href="#">利用規約</a><a href="#">プライバシー規約</a><a href="#">ヘルプ</a></div>
    <p>© 2026 FREE DEATH</p>
  </footer>
  <script>
    const email = sessionStorage.getItem('freeDeathDemoEmail') || '';
    document.getElementById('accountEmail').textContent = email;
    document.getElementById('createAccount').addEventListener('click', () => {
      location.href='register-demo.html';
    });
  </script>
</body>
</html>
