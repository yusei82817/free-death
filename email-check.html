<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>サインインまたはアカウントを作成 | FREE DEATH</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="email-check.css">
</head>
<body class="email-check-page">
  <div class="fake-browser" aria-label="ブラウザー画面の演出">
    <div class="browser-tabs"><div class="browser-tab active"><span class="tab-favicon">FD</span><span class="tab-title">サインインまたはアカウントを作成 | FREE DEATH</span><span class="tab-close">×</span></div><button class="new-tab">＋</button><div class="browser-window-controls"><span>−</span><span>□</span><span>×</span></div></div>
    <div class="browser-toolbar"><button class="browser-icon" onclick="history.back()">‹</button><button class="browser-icon" onclick="history.forward()">›</button><button class="browser-icon" onclick="location.reload()">↻</button><button class="browser-icon" onclick="location.href='index.html'">⌂</button><div class="browser-address"><span>⊙</span><input value="https://shop.freedeath.jp/ap/signin" aria-label="アドレスバー" spellcheck="false"><span class="address-star">☆</span></div><button class="browser-icon">▣</button><button class="browser-icon">⋮</button></div>
    <div class="browser-bookmarks"><span class="bookmark-app">▦</span><span class="bookmark-app">▦</span><span class="bookmark-app yellow">▦</span><span class="bookmark-app pink">▦</span><span class="bookmark-app violet">▦</span><span class="bookmark-separator"></span><a href="#">Github</a><a href="#">BOOTH</a><a href="#">検索</a><span class="bookmark-separator"></span><span>▦</span><a href="#">学習用サイト</a><a href="#">ストレージサイト</a><span class="bookmark-spacer"></span><a href="#">»</a><a href="#">すべてのブックマーク</a></div>
  </div>
  <main class="signin-main">
    <a class="signin-logo" href="index.html" aria-label="FREE DEATH"><span>FREE DEATH</span></a>
    <section class="signin-card">
      <h1>サインインまたはアカウントを作成</h1>
      <form id="emailForm">
        <label for="email">携帯電話番号またはEメールアドレスを入力します</label>
        <input id="email" name="email" type="email" autocomplete="email" required autofocus>
        <button type="submit">次に進む</button>
      </form>
      <p class="terms">続行することで、FREE DEATHの<a href="#">利用規約</a>および<a href="#">プライバシー規約</a>に同意したものとみなされます。</p>
      <a class="help-link" href="#">ヘルプが必要ですか？</a>
      <div class="signin-divider"></div>
      <strong class="business-title">お仕事のための物品購入ですか？</strong>
      <a class="business-link" href="#">無料のビジネスアカウントを作成する</a>
    </section>
  </main>
  <footer class="signin-footer">
    <div><a href="#">利用規約</a><a href="#">プライバシー規約</a><a href="#">ヘルプ</a></div>
    <p>© 2026 FREE DEATH</p>
  </footer>
  <script>
    const emailInput = document.getElementById('email');
    emailInput.value = sessionStorage.getItem('freeDeathDemoEmail') || '';
    document.getElementById('emailForm').addEventListener('submit', event => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) return;
      sessionStorage.setItem('freeDeathDemoEmail', email);
      location.href = 'account-choice.html';
    });
  </script>
</body>
</html>
