<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eメールアドレスの確認 | FREE DEATH</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="email-check.css"><link rel="stylesheet" href="account-flow.css">
</head><body class="email-check-page"><main class="signin-main"><a class="signin-logo" href="store.html"><span>FREE DEATH</span></a>
<section class="signin-card flow-card code-card"><h1>Eメールアドレスの確認</h1><p class="code-intro"><span id="codeEmail"></span>宛に確認コードを送信しました。下記に入力してください。 <a href="email-check.html">（宛先を変更する）</a></p>
<form id="codeForm"><label for="securityCode">セキュリティコードを入力する</label><input id="securityCode" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required autofocus><button type="submit">アカウントの作成</button><p class="code-error" id="codeError" aria-live="polite"></p></form>
<p class="flow-terms">FREE DEATHの<a href="#">利用規約</a>と<a href="#">プライバシー規約</a>に同意いただける場合はアカウントを作成してください。</p><a class="resend-code" href="#" id="resendCode">コードを再送する</a></section></main>
<footer class="signin-footer"><div><a href="#">利用規約</a><a href="#">プライバシー規約</a><a href="#">ヘルプ</a></div><p>© 2026 FREE DEATH</p></footer>
<script>document.getElementById('codeEmail').textContent=sessionStorage.getItem('freeDeathDemoEmail')||'';document.getElementById('codeForm').addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('securityCode').value.trim();if(v!=='104628'){document.getElementById('codeError').textContent='セキュリティコードが正しくありません。';return;}location.href='checkout-demo.html'});document.getElementById('resendCode').addEventListener('click',e=>{e.preventDefault();alert('デモ用コードは 104628 です。メール送信は行いません。')});</script>
</body></html>
